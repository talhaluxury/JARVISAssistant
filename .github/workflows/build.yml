name: Build JARVIS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          REMOTE_RELAY_URL: ${{ vars.REMOTE_RELAY_URL }}
          AI_DEFAULT_API_KEY: ${{ secrets.AI_DEFAULT_API_KEY }}
          AI_DEFAULT_BASE_URL: ${{ secrets.AI_DEFAULT_BASE_URL }}
          AI_DEFAULT_MODEL: ${{ secrets.AI_DEFAULT_MODEL }}
        run: >
          gradle assembleDebug
          -PREMOTE_RELAY_URL="$REMOTE_RELAY_URL"
          -PAI_DEFAULT_API_KEY="$AI_DEFAULT_API_KEY"
          -PAI_DEFAULT_BASE_URL="$AI_DEFAULT_BASE_URL"
          -PAI_DEFAULT_MODEL="$AI_DEFAULT_MODEL"
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
